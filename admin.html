<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Aroma of Poetry</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 2rem;
    }
    h1, h2 {
      color: #333;
    }
    .section {
      background: #fff;
      padding: 1rem 2rem;
      margin-bottom: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.6rem;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #eee;
    }
    #adminError {
      color: red;
      margin-bottom: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="adminError"></div>

  <h1>Welcome, Admin</h1>

  <div class="section">
    <h2>📊 Dashboard Stats</h2>
    <div id="stats"></div>
  </div>

  <div class="section">
    <h2>📝 Recent Poems</h2>
    <table id="recent-poems-table">
      <thead>
        <tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th><th>Submitted</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>💳 Recent Payments</h2>
    <table id="recent-payments-table">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Amount</th><th>Status</th><th>Created</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>⏳ Pending Items (<span id="pending-count">0</span>)</h2>
    <table id="pending-table">
      <thead>
        <tr><th>Type</th><th>Title</th><th>Email</th><th>Amount</th><th>Created</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const token = localStorage.getItem('adminToken');
    const errorEl = document.getElementById('adminError');

    if (!token) {
      errorEl.textContent = '❌ You must be logged in to access the admin dashboard.';
      setTimeout(() => window.location.href = 'admin-login.html', 2000);
    }

    async function fetchDashboardData() {
      try {
        const res = await fetch('http://localhost:5000/api/dashboard/stats', {
  headers: { Authorization: `Bearer ${token}` }
});

        const data = await res.json();

        if (!data.success) throw new Error('Stats load failed');

        const { poems, newsletter, payments } = data.stats;
        const { poems: recentPoems, payments: recentPayments } = data.recent;

        document.getElementById('stats').innerHTML = `
          <p><strong>Total Poems:</strong> ${poems.total_poems} 
          (Pending: ${poems.pending_poems}, Approved: ${poems.approved_poems}, Rejected: ${poems.rejected_poems})</p>
          <p><strong>Total Subscribers:</strong> ${newsletter.total_subscribers}</p>
          <p><strong>Total Payments:</strong> ${payments.total_payments}, Revenue: ₹${payments.total_revenue || 0}</p>
        `;

        const poemsTable = document.querySelector('#recent-poems-table tbody');
        poemsTable.innerHTML = '';
        recentPoems.forEach(p => {
          poemsTable.innerHTML += `<tr>
            <td>${p.id}</td>
            <td>${p.title}</td>
            <td>${p.author_name}</td>
            <td>${p.status}</td>
            <td>${new Date(p.created_at).toLocaleString()}</td>
          </tr>`;
        });

        const paymentsTable = document.querySelector('#recent-payments-table tbody');
        paymentsTable.innerHTML = '';
        recentPayments.forEach(p => {
          paymentsTable.innerHTML += `<tr>
            <td>${p.id}</td>
            <td>${p.full_name}</td>
            <td>${p.email}</td>
            <td>₹${p.amount}</td>
            <td>${p.status}</td>
            <td>${new Date(p.created_at).toLocaleString()}</td>
          </tr>`;
        });

      } catch (err) {
        errorEl.textContent = '⚠️ Unable to load dashboard statistics.';
        console.error(err);
      }
    }

    async function fetchPendingItems() {
      try {
        const res = await fetch('/api/dashboard/pending', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();

        if (!data.success) throw new Error('Pending fetch failed');

        const pendingTable = document.querySelector('#pending-table tbody');
        pendingTable.innerHTML = '';
        data.pending.forEach(item => {
          pendingTable.innerHTML += `<tr>
            <td>${item.type}</td>
            <td>${item.title}</td>
            <td>${item.author_email}</td>
            <td>${item.amount || '-'}</td>
            <td>${new Date(item.created_at).toLocaleString()}</td>
          </tr>`;
        });

        document.getElementById('pending-count').textContent = data.count;

      } catch (err) {
        errorEl.textContent = '⚠️ Unable to load pending items.';
        console.error(err);
      }
    }

    fetchDashboardData();
    fetchPendingItems();
  </script>

</body>
</html>
