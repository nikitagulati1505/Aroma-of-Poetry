<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- SEO Meta Tags -->
<meta name="description" content="Aroma of Poetry - Share and discover beautiful poetry. Submit your verses and explore curated collections of poems.">
<meta name="keywords" content="poetry, poems, writing, literature, creative writing, submit poetry">
<meta name="author" content="Aroma of Poetry">

<!-- Open Graph Meta Tags -->
<meta property="og:title" content="Aroma of Poetry - Where Words Blossom">
<meta property="og:description" content="Discover, Create, Share Poetry">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nikitagulati1505.github.io/Aroma-of-Poetry/">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="poems/flower brain in the style of monument valley.jpg">
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poem Submission Payment</title>

    <!-- Global + page styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/payment.css" />
  </head>
  <body>
    <main class="pay-main">
      <section class="pay-card">
        <h1 class="pay-title">Payment&nbsp;Form</h1>
        <form id="paymentForm">
          <!-- Contact -->
          <h2 class="section-title">Contact&nbsp;Information</h2>
          <label>Full&nbsp;Name*<input type="text" name="name" required placeholder="Nancy Dua" /></label>

          <fieldset class="gender-field">
            <legend>Gender*</legend>
            <label><input type="radio" name="gender" value="male" required /> Male</label>
            <label><input type="radio" name="gender" value="female" required /> Female</label>
          </fieldset>

          <label>Address<textarea name="address" rows="4" placeholder="Enter your address"></textarea></label>
          <label>Email*<input type="email" name="email" required placeholder="xyz@gmail.com" /></label>
          <label>Pincode<input type="number" name="pincode" placeholder="123456" /></label>

          <!-- Payment -->
          <h2 class="section-title">Payment&nbsp;Details</h2>
          <label>Card&nbsp;Type*<select name="card_type" required>
              <option value="">— select —</option>
              <option value="rupay">Rupay</option>
              <option value="visa">Visa</option>
              <option value="mastercard">MasterCard</option>
            </select></label>
          <label>Card&nbsp;Number*<input type="text" name="card_number" required placeholder="1111‑2222‑3333‑4444" /></label>
          <label>CVV*<input type="password" name="cvv" required placeholder="123" /></label>

          <button type="submit" class="btn-primary pay-btn">Pay&nbsp;Now</button>
          <p class="note">* required fields</p>
        </form>
      </section>
    </main>

   <script>
document.getElementById('paymentForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const form = e.target;
  const formData = new FormData(form);

  const body = {
    name: formData.get('name'),
    gender: formData.get('gender'),
    address: formData.get('address'),
    email: formData.get('email'),
    pincode: formData.get('pincode'),
    card_type: formData.get('card_type'),
    card_number: formData.get('card_number'),
    cvv: formData.get('cvv'),
    amount: 80
  };

  // ⬇️ Grab poemId from query string
  const params = new URLSearchParams(window.location.search);
  const poemId = params.get('poemId');

  if (poemId) {
    body.poemId = poemId;
  }

  try {
    const response = await fetch('http://localhost:5000/api/payments/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await response.json();

    if (data.success) {
      alert('Payment successful! Your poem will now be reviewed.');
      form.reset();
    } else {
      alert(data.message || 'Payment failed');
    }
  } catch (err) {
    alert('Something went wrong. Please try again.');
  }
});
</script>

  </body>
</html>
